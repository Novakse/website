         "sleutel"  korte naam, moet uniek zijn (komt ook in het webadres)
         "label"    de kop die in het document bovenin komt te staan
         "vraag"    de grote vraag op het scherm
         "onder"    kleine zin onder de vraag (mag weg)
         "soort"    bestemming | reizigers | datum | aantal | keuze | stad | extras | tekst | gegevens
         "opties"   bij soort "keuze": elke regel {"naam": "...", "toelichting": "..."}
         "overslaan" op true: de bezoeker mag deze stap overslaan
