  <!-- ==========================================================================
       INHOUD VAN DE STAPPEN BIJWERKEN

       Alles wat de bezoeker te zien krijgt staat hieronder. Je kunt vragen
       toevoegen, verwijderen of van volgorde wisselen zonder de code te raken.

       Per stap:
         "sleutel"  korte naam, moet uniek zijn (komt ook in het webadres)
         "label"    de kop die in het document bovenin komt te staan
         "vraag"    de grote vraag op het scherm
         "onder"    kleine zin onder de vraag (mag weg)
         "soort"    bestemming | reizigers | datum | aantal | keuze | stad | extras | tekst | gegevens
         "opties"   bij soort "keuze": elke regel {"naam": "...", "toelichting": "..."}
         "overslaan" op true: de bezoeker mag deze stap overslaan
         "verplicht" true: the request is only sent once this step has an answer

       Bij "extras" staan de activiteiten per bestemming, onderaan bij de
       bestemming zelf. Prijzen zijn per persoon, in hele euro's. Heeft een
       bestemming geen extra's, dan slaat de pagina die stap vanzelf over.
       "extrasUit": a destination with this key (for example "falun") loads
       its extras from data/activiteiten.json, the same list and prices as
       the checkout page. Change those prices there, not here. An extra may
       carry an "eenheid" (for example "per scooter"); without it the price
       counts as "per persoon". Amounts with different units are never
       added together.
       ========================================================================== -->
