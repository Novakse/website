  :root {
    --ink: #14181a;
    --paper: #ffffff;
    --paper-soft: #f2f3f0;
    --warm: #dd9752;
    --warm-deep: #7a4620;
    --edge: 14mm;          /* safe margin, >= 12 mm */
  }
  @page { size: 210mm 297mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #d9dcd8; }
  body { font-family: "Work Sans", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

  .flyer {
    position: relative;
    width: 210mm;
    height: 297mm;
    overflow: hidden;
    background: #9fb9cc;
  }
  .flyer__photo {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .flyer__line {
    position: absolute; inset: 0;
    width: 210mm; height: 297mm;
  }

  /* Sky: headline and one line */
  /* The words stand on the horizon: the treeline in the photo is the only "rule". */
  .flyer__words {
    position: absolute;
    left: var(--edge);
    bottom: 104mm;          /* sits just above the treeline at ~201 mm */
  }
  .flyer__title {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 27mm;
    line-height: 0.9;
    letter-spacing: -0.03em;
    color: var(--ink);
  }
  .flyer__lede {
    margin-top: 5mm;
    font-size: 5.2mm;
    line-height: 1.3;
    font-weight: 400;
    color: var(--ink);
  }

  /* Ice: scan prompt and QR, bottom left */
  .flyer__scan {
    position: absolute;
    left: var(--edge);
    bottom: calc(var(--edge) + 44mm + 4mm);
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 6.2mm;
    line-height: 1.08;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .flyer__qr {
    position: absolute;
    left: var(--edge);      /* white square incl. 4-module quiet zone */
    bottom: var(--edge);
    width: 44mm; height: 44mm;   /* incl. quiet zone; modules are ~36.8 mm */
    display: block;
  }

  /* Ice: signature, bottom right */
  .flyer__sign {
    position: absolute;
    right: var(--edge);
    bottom: var(--edge);
    text-align: right;
    line-height: 1.2;
    color: var(--ink);
  }
  .flyer__logo { display: block; width: 40mm; height: auto; margin: 0 0 2.4mm auto; }
  .flyer__site { font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 5mm; }
</style>
