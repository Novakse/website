<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novakse flyer concept B</title>
<style>
  /* Concept B "Licht, met de baan als route".
     The paper is the snow; the photo only shows where the track is swept.
     All geometry is in millimetres on an A4 portrait page (210 x 297). */
  @font-face { font-family: "Space Grotesk"; font-weight: 400 700; font-style: normal;
    src: url("assets/space-grotesk-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Space Grotesk"; font-weight: 400 700; font-style: normal;
    src: url("assets/space-grotesk-latin-ext.woff2") format("woff2");
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "Work Sans"; font-weight: 300 600; font-style: normal;
    src: url("assets/work-sans-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Work Sans"; font-weight: 300 600; font-style: normal;
    src: url("assets/work-sans-latin-ext.woff2") format("woff2");
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF; }

  :root {
    --ink: #14181a;
    --paper: #fff;
    --paper-soft: #f2f3f0;
    --warm: #dd9752;
    --warm-deep: #7a4620;
    --mute: #475055;
  }
  @page { size: 210mm 297mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #d9dcd8; }
  body { font-family: "Work Sans", sans-serif; color: var(--ink);
    -webkit-font-smoothing: antialiased; }

  .sheet {
    position: relative; width: 210mm; height: 297mm; overflow: hidden;
    background: var(--paper-soft);
  }
  .art { position: absolute; inset: 0; width: 210mm; height: 297mm; display: block; }

  /* Everything typographic sits on the snow, never on the photo. */
  .headline {
    position: absolute; left: 15mm; top: 14mm;
    font-family: "Space Grotesk", sans-serif; font-weight: 600;
    font-size: 27mm; line-height: 0.9; letter-spacing: -0.04em;
  }
  .intro {
    position: absolute; left: 16.6mm; top: 69mm; width: 100mm;
    font-size: 5.4mm; line-height: 1.3;
  }
  .extra {
    position: absolute; left: 16.4mm; bottom: 63mm;
    font-size: 3.8mm; line-height: 1.38; color: var(--mute); white-space: nowrap;
  }

  .stop { position: absolute; white-space: nowrap; }
  .stop b { display: block; font-family: "Space Grotesk", sans-serif; font-weight: 500;
    font-size: 7.6mm; line-height: 0.95; letter-spacing: -0.02em; }
  .stop span { display: block; margin-top: 1.4mm; font-size: 3.4mm; line-height: 1;
    color: var(--warm-deep); letter-spacing: 0.01em; }
  /* The anchor is the stop mark on the route line; the label hangs off it. */
  .stop[data-place="below"]       { transform: translate(-1.6mm, 3mm); }
  .stop[data-place="below-end"]   { transform: translate(calc(-100% + 1.6mm), 3mm); text-align: right; }
  .stop[data-place="right"]       { transform: translate(4mm, -3.8mm); }
  .stop[data-place="right-high"]  { transform: translate(4.2mm, -8.6mm); }
  .stop[data-place="above-right"] { transform: translate(3mm, calc(-100% - 1mm)); }

  .qr { position: absolute; left: 16mm; bottom: 16mm; width: 42mm; height: 42mm; display: block; }
  .contact { position: absolute; left: 63mm; top: 239mm; height: 42mm; width: 60mm; }
  .contact .cta { font-family: "Space Grotesk", sans-serif; font-weight: 600;
    font-size: 7.2mm; line-height: 1; letter-spacing: -0.025em; margin-top: 1mm; }
  .contact .url { margin-top: 2.6mm; font-family: "Space Grotesk", sans-serif; font-weight: 500;
    font-size: 5mm; line-height: 1.2; }
  .contact .small { font-size: 3.8mm; line-height: 1.42; }
  .contact .logo { position: absolute; left: 0; bottom: 0.4mm; height: 5.2mm; display: block; }
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <svg class="art" viewBox="0 0 210 297" aria-hidden="true">
    <defs>
      <clipPath id="track-clip"><path id="track-shape" d=""/></clipPath>
    </defs>
    <!-- Centre line of the swept track, from far (top right) to near (bottom). -->
    <path id="track-centre" fill="none" stroke="none"
      d="M 224,98 C 166,96 104,104 76,136 C 48,166 60,192 100,204 C 144,218 182,240 194,306"/>
    <image id="track-photo" href="assets/wijds-uitzicht-mooi-ijs.jpg"
      x="-34" y="-49" width="570" height="380" preserveAspectRatio="none"
      clip-path="url(#track-clip)"/>
    <path id="route-line" fill="none" stroke="#dd9752" stroke-width="0.9" stroke-linecap="round" d=""/>
    <g id="stop-marks"></g>
  </svg>

  <h1 class="headline">Schaatsreizen<br>op natuurijs</h1>
  <p class="intro">Zweden, Finland en Oostenrijk.<br>Persoonlijk geregeld door Joey.</p>
  <p class="extra">Ook: schaatslessen in Leeuwarden<br>en schaatsonderhoud.</p>

  <div id="stops"></div>

  <img class="qr" src="assets/qr-reizen.svg" alt="QR-code naar novakse.com/reizen.html">
  <div class="contact">
    <p class="cta">Scan en bekijk<br>alle reizen</p>
    <p class="url">novakse.com</p>
    <p class="small">+31 6 17467643<br>@schaatsreizennovakse</p>
    <img class="logo" src="assets/logo-word-dark.png" alt="Novakse">
  </div>
</div>

<script>
  // Builds the swept track from its centre line: narrow in the distance,
  // wide close by, so the photo reads as clear ice seen along a swept lane.
  const TRACK = { farWidth: 6, nearWidth: 68, ease: 1.5, samples: 520 };
  // Far to near, following the centre line. t = position along the line,
  // place = where the label hangs off its mark (see .stop[data-place]).
  const STOPS = [
    { name: "Punkaharju", country: "Finland",    t: 0.09,  place: "below-end" },
    { name: "Luleå",      country: "Zweden",     t: 0.26,  place: "below" },
    { name: "Sälen",      country: "Zweden",     t: 0.37,  place: "right" },
    { name: "Orsa",       country: "Zweden",     t: 0.455, place: "right-high" },
    { name: "Falun",      country: "Zweden",     t: 0.555, place: "above-right" },
    { name: "Weissensee", country: "Oostenrijk", t: 0.665, place: "above-right" },
  ];
  const ROUTE_OFFSET = 2.8; // mm between the track's inner edge and the warm route line

  const centre = document.getElementById("track-centre");
  const L = centre.getTotalLength();
  const widthAt = s => TRACK.farWidth + (TRACK.nearWidth - TRACK.farWidth) * Math.pow(s / L, TRACK.ease);

  // Point on the centre line plus the unit normal pointing to the inside of
  // the first bend (downwards where the track runs from right to left).
  function frame(s) {
    const a = centre.getPointAtLength(Math.max(0, s - 0.4));
    const b = centre.getPointAtLength(Math.min(L, s + 0.4));
    const p = centre.getPointAtLength(s);
    let dx = b.x - a.x, dy = b.y - a.y; const len = Math.hypot(dx, dy) || 1;
    return { x: p.x, y: p.y, nx: dy / len, ny: -dx / len };
  }

  const outer = [], inner = [], route = [];
  for (let i = 0; i <= TRACK.samples; i++) {
    const s = (i / TRACK.samples) * L;
    const f = frame(s), h = widthAt(s) / 2;
    outer.push([f.x - f.nx * h, f.y - f.ny * h]);
    inner.push([f.x + f.nx * h, f.y + f.ny * h]);
    route.push([f.x + f.nx * (h + ROUTE_OFFSET), f.y + f.ny * (h + ROUTE_OFFSET)]);
  }
  const pts = a => a.map(p => p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" L ");
  document.getElementById("track-shape").setAttribute("d",
    "M " + pts(outer) + " L " + pts(inner.slice().reverse()) + " Z");
  document.getElementById("route-line").setAttribute("d", "M " + pts(route));

  const marks = document.getElementById("stop-marks");
  const holder = document.getElementById("stops");
  const NS = "http://www.w3.org/2000/svg";
  // Cumulative length of the route line, so stops can be spaced by what
  // the eye sees (the inner line is shorter than the centre line in bends).
  const routeLen = [0];
  for (let i = 1; i < route.length; i++)
    routeLen.push(routeLen[i - 1] + Math.hypot(route[i][0] - route[i - 1][0], route[i][1] - route[i - 1][1]));
  const onRoute = t => {
    const target = t * routeLen[routeLen.length - 1];
    let i = routeLen.findIndex(v => v >= target); if (i < 1) i = 1;
    const k = (target - routeLen[i - 1]) / ((routeLen[i] - routeLen[i - 1]) || 1);
    return [route[i - 1][0] + k * (route[i][0] - route[i - 1][0]), route[i - 1][1] + k * (route[i][1] - route[i - 1][1])];
  };
  for (const st of STOPS) {
    const [x, y] = onRoute(st.t);
    const dot = document.createElementNS(NS, "circle");
    dot.setAttribute("cx", x); dot.setAttribute("cy", y); dot.setAttribute("r", 1.5);
    dot.setAttribute("fill", "#f2f3f0"); dot.setAttribute("stroke", "#7a4620"); dot.setAttribute("stroke-width", 0.75);
    marks.appendChild(dot);
    const el = document.createElement("p");
    el.className = "stop";
    el.dataset.place = st.place;
    el.style.left = x + "mm";
    el.style.top = y + "mm";
    el.innerHTML = "<b>" + st.name + "</b><span>" + st.country + "</span>";
    holder.appendChild(el);
  }
</script>
</body>
</html>
